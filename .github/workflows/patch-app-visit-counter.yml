name: Patch app.py visit counter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-app-visit-counter.yml

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch app.py
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          text = p.read_text()
          original = text

          # app.py currently calls enforce_geo_access() before the function exists.
          # Keep the geo gate, but call it later inside main().
          text = text.replace(
              'st.set_page_config(page_title="Bank Statement Processor", layout="wide")\nenforce_geo_access()',
              'st.set_page_config(page_title="Bank Statement Processor", layout="wide")'
          )

          # ip_blocks has no id column. This check only needs to know if a row exists.
          text = text.replace(
              '"SELECT id FROM ip_blocks WHERE ip = ? AND expires_at_utc > ?"',
              '"SELECT 1 FROM ip_blocks WHERE ip = ? AND expires_at_utc > ?"'
          )

          visit_code = '''
# ==========================================================================
# Public website visit counter
# ==========================================================================
def record_site_visit_once():
    """
    Count one website visit per Streamlit browser session.
    This does not affect upload/process/download limits.
    """
    if st.session_state.get("site_visit_recorded"):
        return

    log_event("site_visit", "")
    st.session_state["site_visit_recorded"] = True


def get_total_site_visits() -> int:
    try:
        conn = get_db()
        cur = conn.cursor()
        cur.execute("SELECT COUNT(*) FROM access_log WHERE action = 'site_visit'")
        count = cur.fetchone()[0] or 0
        conn.close()
        return int(count)
    except Exception as e:
        logger.warning("get_total_site_visits failed: %s", e)
        return 0


def render_visit_counter():
    total_visits = get_total_site_visits()
    st.markdown(
        f"""
        <div style="display:flex;justify-content:flex-end;width:100%;margin-bottom:.4rem;">
            <div style="
                display:inline-flex;
                align-items:center;
                gap:7px;
                background:#ffffff;
                border:1px solid #e6edf5;
                border-radius:999px;
                padding:7px 13px;
                font-size:.86rem;
                color:#344054;
                box-shadow:0 1px 2px rgba(16,24,40,.04);
            ">
                👀 Total visits: <strong>{total_visits:,}</strong>
            </div>
        </div>
        """,
        unsafe_allow_html=True,
    )

'''

          if "def render_visit_counter()" not in text:
              marker = "# ==========================================================================\n# Per-feature rate limiting\n# ==========================================================================\n"
              if marker not in text:
                  raise SystemExit("Could not find rate limiting marker to insert visit counter")
              text = text.replace(marker, visit_code + marker, 1)

          # In main(), call geo enforcement after all functions exist, then count allowed visits.
          old_main_start = '''def main():
    inject_custom_css()
    ensure_app_directories()
    get_db()
'''
          new_main_start = '''def main():
    inject_custom_css()
    ensure_app_directories()
    get_db()
    enforce_geo_access()
    record_site_visit_once()
'''
          if "record_site_visit_once()" not in text.split("def main():", 1)[1].split("current_doc_name", 1)[0]:
              if old_main_start not in text:
                  raise SystemExit("Could not find main() startup block")
              text = text.replace(old_main_start, new_main_start, 1)

          # Display the public counter on the right side above the title.
          old_right_title = '''    with right_col:
        st.markdown('<div class="hero-title">Bank Statement Processor</div>', unsafe_allow_html=True)
'''
          new_right_title = '''    with right_col:
        render_visit_counter()
        st.markdown('<div class="hero-title">Bank Statement Processor</div>', unsafe_allow_html=True)
'''
          if "render_visit_counter()" not in text.split("with right_col:", 1)[1].split("hero-title", 1)[0]:
              if old_right_title not in text:
                  raise SystemExit("Could not find right_col hero title block")
              text = text.replace(old_right_title, new_right_title, 1)

          if text != original:
              p.write_text(text)
              print("app.py patched")
          else:
              print("app.py already up to date")
          PY

      - name: Validate syntax
        run: python3 -m py_compile app.py

      - name: Commit patched app.py
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add visible public visit counter to app"
          git push
